[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jll-harvester"
version = "1.0.0"
description = "IRIS-SIG-45 — JLL Germany research & transactions newsroom harvester (land disposals and big-box industrial development signals) for PostGIS staging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — candidate assignment" }
authors = [{ name = "Shahid Karimi" }]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "lxml>=5.2",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyproj>=3.6,<4",
    "typer>=0.12,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
jll-harvester = "jll_harvester.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jll_harvester"]
exclude = ["src/jll_harvester/web/static/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a PostgreSQL 16 / PostGIS 3.4 database (set IRIS_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003", "B008", "E501"]  # long lines: SQL strings; layout is ruff format's job

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
