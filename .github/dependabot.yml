# Weekly, grouped update PRs; each one goes through CI before it can be merged and deployed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      css-tooling: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
